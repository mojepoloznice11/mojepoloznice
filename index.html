<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moje Položnice</title>

  <!-- PWA & Mobile Settings -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Položnice">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">

  <style>
    :root {
      --primary: #2563eb;          /* Modern Royal Blue */
      --primary-dark: #1d4ed8;     /* Deep Blue */
      --primary-light: #eff6ff;    /* Soft Blue Tint */
      --success: #10b981;          /* Green Check */
      --success-bg: #ecfdf5;
      --bg: #f8fafc;               /* Clean Light Background */
      --card-bg: #ffffff;
      --text: #0f172a;             /* Dark Slate Text */
      --text-muted: #64748b;       /* Slate Muted */
      --border: #e2e8f0;           /* Border */
      --radius: 18px;
      --shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.1), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Month Selector - Blue Gradient */
    header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      padding: 22px;
      border-radius: var(--radius);
      box-shadow: 0 10px 24px -6px rgba(37, 99, 235, 0.35);
    }

    .month-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .month-selector button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .month-selector button:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .month-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Summary Card */
    .summary-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-radius: 14px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    /* Bills List */
    .bills-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bill-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .bill-item.paid {
      background: var(--success-bg);
      border-color: #a7f3d0;
    }

    .bill-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    /* Round Circle Checkbox (Krožec) */
    .checkbox-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
      color: white;
    }

    .bill-item.paid .checkbox-circle {
      background: var(--success);
      border-color: var(--success);
    }

    .bill-title-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .bill-title {
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bill-item.paid .bill-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Visual Badges for Recurring vs One-time */
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      width: fit-content;
    }

    .badge.recurring {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge.single {
      background: #f1f5f9;
      color: #64748b;
    }

    .bill-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .amount-input-group {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      width: 95px;
    }

    .amount-input-group span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 2px;
    }

    .amount-input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      outline: none;
      text-align: right;
    }

    /* Modern SVG Action Buttons */
    .icon-btn {
      background: #eff6ff;
      border: none;
      color: var(--primary);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--primary);
      color: white;
    }

    .icon-btn.danger {
      color: #ef4444;
      background: #fef2f2;
    }

    .icon-btn.danger:hover {
      background: #ef4444;
      color: white;
    }

    /* Add Bill Card at the bottom of the list */
    .add-bill-card {
      background: #eff6ff;
      border: 2px dashed #bfdbfe;
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .add-bill-card:hover {
      background: #dbeafe;
      border-color: var(--primary);
    }

    .add-bill-card:active {
      transform: scale(0.99);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.2s ease-out;
      border-top: 4px solid var(--primary);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 15px;
      outline: none;
      color: var(--text);
    }

    .form-control:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    /* Option Radio Cards */
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-card {
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-card input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .option-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
      margin-top: 6px;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
    }

    .month-selector .month-title { width:auto; height:auto; min-width:0; flex:1; border-radius:10px; }
    .month-title { border:0; background:transparent; color:inherit; cursor:pointer; padding:6px 8px; border-radius:10px; }
    .month-title:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
    #monthPicker { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    .month-tools { display:flex; justify-content:center; margin:-7px 0 14px; }
    #todayBtn { border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.16); color:white; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; }
    .bill-right { flex-wrap:wrap; }
    .bill-amount-mobile { font-size:14px; font-weight:750; color:var(--text); margin-top:4px; }
    .icon-btn { min-width:38px; min-height:38px; }
    .checkbox-circle { min-width:34px; min-height:34px; }
    .toast { position:fixed; z-index:2000; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0; pointer-events:none; background:#0f172a; color:white; padding:12px 16px; border-radius:12px; box-shadow:0 8px 30px rgba(15,23,42,.22); max-width:calc(100vw - 32px); width:max-content; font-size:14px; transition:opacity .2s ease, transform .2s ease; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast.error { background:#991b1b; }
    .btn-secondary { background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; padding:13px; border-radius:14px; font-size:15px; font-weight:650; cursor:pointer; }
    .form-help { color:var(--text-muted); font-size:12px; line-height:1.45; }
    .modal-card { max-height: min(90dvh, 760px); overflow-y:auto; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
    @media (min-width: 600px) { .modal-overlay { align-items:center; padding:20px; } .modal-card { border-radius:24px; border-top:4px solid var(--primary); } }
    @media (max-width: 380px) { .app-container { padding:10px; gap:12px; } header { padding:16px; } .month-title { font-size:18px; } .bill-item { padding:12px 10px; gap:7px; } .bill-left { gap:8px; } .bill-right { gap:4px; } .amount-input-group { width:86px; padding:6px; } .bill-title { font-size:14px; } .icon-btn { min-width:34px; min-height:34px; } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header with Month & Summary -->
    <header>
      <div class="month-selector">
        <button id="prevMonthBtn" aria-label="Prejšnji mesec">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="month-title" id="monthTitle" type="button" aria-label="Izberi mesec">Oktober 2026</button>
        <input id="monthPicker" type="month" aria-label="Izberi mesec" tabindex="-1">
        <button id="nextMonthBtn" aria-label="Naslednji mesec">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="month-tools"><button id="todayBtn" type="button">Danes</button></div>

      <div class="summary-cards">
        <div class="stat-card">
          <div class="stat-label">Plačano ta mesec</div>
          <div class="stat-value" id="totalPaid">0,00 €</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Še za plačilo</div>
          <div class="stat-value" id="totalUnpaid">0,00 €</div>
        </div>
      </div>
    </header>

    <!-- Main Bills List -->
    <div class="bills-list" id="billsList">
      <!-- Generated items -->
    </div>

    <!-- Add Bill Button at the end of the list -->
    <div class="add-bill-card" onclick="openAddModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Dodaj novo položnico
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Add New Bill Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Nova položnica</div>
        <button class="icon-btn" onclick="closeAddModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="form-group">
        <label>Naziv položnice</label>
        <input type="text" id="inputTitle" class="form-control" placeholder="npr. Elektrika, Komunala..." required>
      </div>

      <div class="form-group">
        <label>Znesek (€)</label>
        <input type="number" step="0.01" id="inputAmount" class="form-control" placeholder="0.00">
      </div>

      <div class="form-group">
        <label>Pogostost položnice</label>
        <div class="option-group">
          <label class="option-card selected" id="optFutureLabel">
            <input type="radio" name="addType" id="optFuture" value="future" checked onchange="updateOptionStyle()">
            <div>
              <strong style="font-size:14px;">Za vse mesece naprej</strong>
              <div style="font-size:12px; color:var(--text-muted);">Redna položnica (ponavlja se vsak mesec)</div>
            </div>
          </label>

          <label class="option-card" id="optCurrentLabel">
            <input type="radio" name="addType" id="optCurrent" value="current" onchange="updateOptionStyle()">
            <div>
              <strong style="font-size:14px;">Samo za ta mesec</strong>
              <div style="font-size:12px; color:var(--text-muted);">Enokratni strošek za tekoči mesec</div>
            </div>
          </label>
        </div>
      </div>

      <button class="btn-submit" onclick="saveBill()">Dodaj položnico</button>
    </div>
  </div>

  <!-- Enoten obrazec za urejanje -->
  <div class="modal-overlay" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="editModalTitle">Uredi položnico</div>
        <button class="icon-btn" type="button" onclick="closeEditModal()" aria-label="Zapri">✕</button>
      </div>
      <div class="form-group"><label for="editTitle">Naziv položnice</label><input type="text" id="editTitle" class="form-control" maxlength="200" required></div>
      <div class="form-group"><label for="editAmount">Znesek (€)</label><input type="number" id="editAmount" class="form-control" min="0" step="0.01" inputmode="decimal" required></div>
      <div class="form-group"><label>Veljavnost spremembe</label><div class="form-control" aria-readonly="true">Od izbranega meseca naprej</div><small class="form-help">Naziv se v trenutnem API-ju spremeni za vse mesece. Znesek velja od izbranega meseca naprej; pretekli meseci ostanejo nespremenjeni.</small></div>
      <button class="btn-submit" type="button" onclick="saveEditBill()">Shrani spremembe</button>
      <button class="btn-secondary" type="button" onclick="closeEditModal()">Prekliči</button>
    </div>
  </div>

  <script>
    // Podatki o položnicah se berejo in shranjujejo izključno prek Cloudflare Worker API-ja.
    const API_BASE = 'https://moje-poloznice-api.mojepoloznice11.workers.dev';
    const MONTH_NAMES = ['Januar','Februar','Marec','April','Maj','Junij','Julij','Avgust','September','Oktober','November','December'];
    let currentDate = new Date();
    let monthBills = [];
    let authToken = sessionStorage.getItem('poloznice_api_token') || '';
    let busy = false;

    function getMonthKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
    }
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
    async function api(path, options = {}) {
      const headers = {'Content-Type':'application/json', ...(options.headers || {})};
      if (authToken) headers.Authorization = `Bearer ${authToken}`;
      const response = await fetch(API_BASE + path, {...options, headers});
      let data = {};
      try { data = await response.json(); } catch {}
      if (response.status === 401 && path !== '/api/login') {
        authToken = ''; sessionStorage.removeItem('poloznice_api_token');
        throw new Error('Prijava je potekla. Osveži stran in se ponovno prijavi.');
      }
      if (!response.ok) throw new Error(data.error || `Napaka strežnika (${response.status}).`);
      return data;
    }
    async function login() {
      const password = prompt('Vnesi geslo za aplikacijo Moje Položnice:');
      if (password === null) {
        document.getElementById('billsList').innerHTML = '<div class="empty-state"><p>Za uporabo aplikacije se moraš prijaviti.</p><button class="btn-submit" onclick="login().then(loadMonth).catch(showError)">Prijava</button></div>';
        return false;
      }
      const data = await api('/api/login', {method:'POST', headers:{}, body:JSON.stringify({password})});
      authToken = data.token;
      sessionStorage.setItem('poloznice_api_token', authToken);
      return true;
    }
    let toastTimer;
    function showToast(message, isError=false) {
      const toast = document.getElementById('toast');
      toast.textContent = message; toast.classList.toggle('error', !!isError); toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }
    function showError(error) {
      console.error(error);
      const list = document.getElementById('billsList');
      list.innerHTML = `<div class="empty-state"><p>${escapeHtml(error?.message || 'Prišlo je do napake.')}</p><button class="btn-submit" onclick="loadMonth().catch(showError)">Poskusi znova</button></div>`;
    }
    async function loadMonth() {
      if (!authToken) { if (!(await login())) return; }
      const data = await api('/api/month?month=' + encodeURIComponent(getMonthKey(currentDate)));
      monthBills = Array.isArray(data.bills) ? data.bills : [];
      render();
    }
    function updateMonthDisplay() {
      document.getElementById('monthTitle').textContent = `${MONTH_NAMES[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
    }
    function updateSummary(bills) {
      let paidTotal = 0, unpaidTotal = 0;
      bills.forEach(b => { if (b.paid) paidTotal += Number(b.amount)||0; else unpaidTotal += Number(b.amount)||0; });
      document.getElementById('totalPaid').textContent = paidTotal.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('totalUnpaid').textContent = unpaidTotal.toFixed(2).replace('.', ',') + ' €';
    }
    function render() {
      updateMonthDisplay(); updateSummary(monthBills);
      const list = document.getElementById('billsList'); list.innerHTML = '';
      if (!monthBills.length) {
        list.innerHTML = '<div class="empty-state"><div style="font-size:32px;margin-bottom:6px">🧾</div><p>Za ta mesec še ni vnesenih položnic.</p></div>';
        return;
      }
      monthBills.forEach(bill => {
        const card = document.createElement('div'); card.className = `bill-item ${bill.paid?'paid':''}`;
        const check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        const pencil = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
        const trash = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        card.innerHTML = `<div class="bill-left"><button type="button" class="checkbox-circle" onclick="togglePaid('${bill.id}')" aria-label="${bill.paid?'Označi kot neplačano':'Označi kot plačano'}">${bill.paid?check:''}</button><div class="bill-title-container"><div class="bill-title">${escapeHtml(bill.title)}</div><span class="badge ${bill.recurring?'recurring':'single'}">${bill.recurring?'Redna':'Samo ta mesec'}</span><div class="bill-amount-mobile">${(Number(bill.amount)||0).toLocaleString('sl-SI',{style:'currency',currency:'EUR'})}</div></div></div><div class="bill-right"><button class="icon-btn" onclick="openEditModal('${bill.id}')" title="Uredi položnico" aria-label="Uredi položnico">${pencil}</button><button class="icon-btn danger" onclick="deleteBill('${bill.id}')" title="Izbriši položnico" aria-label="Izbriši položnico">${trash}</button></div>`;
        list.appendChild(card);
      });
    }
    async function togglePaid(id) {
      const bill = monthBills.find(b=>String(b.id)===String(id)); if(!bill||busy)return;
      busy=true;
      try { await api('/api/month-bills/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({paid:!bill.paid})}); await loadMonth(); showToast(bill.paid?'Plačilo je odstranjeno.':'Položnica označena kot plačana.'); }
      catch(e){showError(e); showToast('Shranjevanje ni uspelo. '+(e.message||''),true)} finally{busy=false;}
    }
    let editingBill = null;
    function openEditModal(id) {
      editingBill = monthBills.find(b => String(b.id) === String(id));
      if (!editingBill) return;
      document.getElementById('editTitle').value = editingBill.title;
      document.getElementById('editAmount').value = Number(editingBill.amount)||0;
      document.getElementById('editScope').value = 'future';
      document.getElementById('editModal').classList.add('active');
      setTimeout(() => document.getElementById('editTitle').focus(), 50);
    }
    function closeEditModal() { document.getElementById('editModal').classList.remove('active'); editingBill = null; }
    async function saveEditBill() {
      if (!editingBill || busy) return;
      const title = document.getElementById('editTitle').value.trim();
      const amount = Number(document.getElementById('editAmount').value);
      if (!title || title.length > 200) { showToast('Vnesi naziv (največ 200 znakov).', true); return; }
      if (!Number.isFinite(amount) || amount < 0 || amount > 100000000) { showToast('Vnesi veljaven znesek.', true); return; }
      busy = true;
      try {
        const id = editingBill.id;
        await api('/api/month-bills/'+encodeURIComponent(id), {method:'PATCH', body:JSON.stringify({title, amount})});
        showToast('Spremembe so shranjene v bazi.');
        closeEditModal(); await loadMonth();
      } catch(e) { showError(e); showToast('Shranjevanje ni uspelo: '+(e.message||''), true); }
      finally { busy = false; }
    }
    async function deleteBill(id) {
      const bill=monthBills.find(b=>String(b.id)===String(id)); if(!bill)return;
      showToast('Brisanje je začasno izklopljeno, da zaščitimo zgodovino plačil.', true);
    }
    function openAddModal() {
      document.getElementById('inputTitle').value=''; document.getElementById('inputAmount').value='';
      document.getElementById('optFuture').checked=true; updateOptionStyle(); document.getElementById('addModal').classList.add('active');
    }
    function closeAddModal(){document.getElementById('addModal').classList.remove('active');}
    function updateOptionStyle(){const future=document.getElementById('optFuture').checked;document.getElementById('optFutureLabel').classList.toggle('selected',future);document.getElementById('optCurrentLabel').classList.toggle('selected',!future);}
    async function saveBill() {
      const title=document.getElementById('inputTitle').value.trim();
      const amount=Number(document.getElementById('inputAmount').value);
      const recurring=document.getElementById('optFuture').checked;
      if(!title){alert('Prosimo, vnesite naziv položnice.');return;}
      if(!Number.isFinite(amount)||amount<0){alert('Prosimo, vnesite veljaven znesek.');return;}
      try {
        await api('/api/bills',{method:'POST',body:JSON.stringify({title,amount,month:getMonthKey(currentDate),recurring})});
        closeAddModal(); await loadMonth(); showToast('Položnica je shranjena v bazi.');
      } catch(e){showError(e); showToast('Položnice ni bilo mogoče shraniti.', true)}
    }
    async function changeMonth(delta) { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+delta, 1); updateMonthDisplay(); try { await loadMonth(); } catch(e) { showError(e); showToast('Meseca ni bilo mogoče naložiti.', true); } }
    document.getElementById('prevMonthBtn').addEventListener('click',()=>changeMonth(-1));
    document.getElementById('nextMonthBtn').addEventListener('click',()=>changeMonth(1));
    document.getElementById('todayBtn').addEventListener('click',()=>{currentDate=new Date();currentDate.setDate(1);changeMonth(0)});
    document.getElementById('monthTitle').addEventListener('click',()=>{const picker=document.getElementById('monthPicker');picker.value=getMonthKey(currentDate);if(picker.showPicker) picker.showPicker(); else picker.click();});
    document.getElementById('monthPicker').addEventListener('change',e=>{if(!e.target.value)return;const [y,m]=e.target.value.split('-').map(Number);currentDate=new Date(y,m-1,1);loadMonth().catch(showError)});
    document.querySelectorAll('.modal-overlay').forEach(overlay=>overlay.addEventListener('click',e=>{if(e.target===overlay){overlay.classList.remove('active');if(overlay.id==='editModal')editingBill=null;}}));
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAddModal();closeEditModal();}});
    loadMonth().catch(showError);
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(err=>console.log('Service worker registration failed:',err)));
  </script>
</body>
</html>
